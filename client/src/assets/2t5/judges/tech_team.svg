<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04131f" />
      <stop offset="55%" stop-color="#07273a" />
      <stop offset="100%" stop-color="#0d3c5c" />
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2133" />
      <stop offset="100%" stop-color="#061521" />
    </linearGradient>
    <linearGradient id="qm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b7f9ff" />
      <stop offset="100%" stop-color="#42b4ff" />
    </linearGradient>
    <filter id="glowQ" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="g" />
      <feMerge>
        <feMergeNode in="g" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="rgba(255,255,255,0.04)" />
    </pattern>
  </defs>
  <rect x="20" y="20" width="360" height="360" rx="32" fill="#031018" stroke="#2d5874" stroke-width="4" />
  <rect x="70" y="90" width="260" height="170" rx="14" fill="url(#case)" stroke="#54d7ff" stroke-width="5" />
  <rect x="92" y="112" width="216" height="126" rx="8" fill="url(#screen)" stroke="#1b445c" stroke-width="3" />
  <rect x="92" y="112" width="216" height="126" rx="8" fill="url(#scan)" />
  <g filter="url(#glowQ)">
    <text x="200" y="200" font-family="'Press Start 2P', monospace" font-size="95" text-anchor="middle" fill="url(#qm)">?</text>
  </g>
  <rect x="120" y="282" width="160" height="20" rx="4" fill="#08273a" stroke="#54d7ff" stroke-width="4" />
  <text x="200" y="298" font-family="'Press Start 2P', monospace" font-size="18" text-anchor="middle" fill="#54d7ff" letter-spacing="4">TECH TEAM</text>
</svg>
